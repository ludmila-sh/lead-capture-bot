# All client-facing text for the bot. Edit here — no Python needed.
#
# How to edit:
#   * Voice: first person, as Artyom (the trainer). Address the reader as "ты".
#   * Write each paragraph on ONE line. Leave an empty line between paragraphs
#     (that becomes a blank line in Telegram). Don't hard-wrap inside a paragraph.
#   * {link} in a lead magnet's `text` is replaced with that magnet's video link.
#   * {name} {contact} {user_id} {segment} {reason} in `handoff_to_expert`
#     are filled by the bot — keep them.
#   * [ ... ] marks a spot to fill per client (prices, Zoom, city).
#
# Later this file can be overridden by a Google Sheets tab (see ROADMAP Phase 4).

default_segment: base

buttons:
  practice: "🧘 Бесплатная практика"
  faq: "❓ Частые вопросы"
  expert: "💬 Написать Артёму"
  subscribe: "📣 Подписаться на канал"
  write_expert: "💬 Открыть чат с Артёмом"
  back_to_menu: "🏠 В меню"
  back_to_faq: "⬅️ К вопросам"

screens:
  greeting: |-
    Привет) Я Артём, тренер по йоге.

    Этот бот — мой помощник: даёт бесплатную практику, отвечает на частые вопросы и зовёт меня, когда нужен живой разговор.

    С чего начнём?

  menu_prompt: "С чего начнём?"

  faq_intro: "Частые вопросы — выбирай:"

  expert: |-
    Пиши свой вопрос прямо сюда — я отвечаю лично, обычно в течение дня. Всё про здоровье, боль и запись — это ко мне, не к боту.

    Можно и в личный чат 👇

  handoff_ack: |-
    Передал Артёму, что ты хочешь на связь — он напишет тебе здесь, в Telegram. Можешь и сам ему написать:

  health_reply: |-
    Спасибо, что написал. Вопросы про боль и здоровье я заочно не разбираю — тут нужен живой разговор. Передал твоё сообщение Артёму, он свяжется. Можешь и сам ему написать:

  fallback: |-
    Я по делу помогаю — практика, частые вопросы, связь с Артёмом. Если это вопрос Артёму — жми «💬 Написать Артёму». А пока держи меню 👇

  # Sent to the expert's chat on a handoff. Keep the {placeholders} and HTML tags.
  handoff_to_expert: |-
    🔔 <b>Новый лид</b>

    Имя: {name}
    Контакт: {contact}
    ID: <code>{user_id}</code>
    Сегмент: {segment}
    Повод: {reason}

# One entry per funnel segment. Key = deep-link parameter (t.me/<bot>?start=<key>),
# latin only. `text` is the first message (with {link}); `question` is the open
# follow-up sent right after.
lead_magnets:
  base:
    label: "Общая"
    link: "https://www.youtube.com/watch?v=FfyhZFAmhSE"
    text: |-
      Привет) Я Артём, тренер по йоге.

      Держи короткую практику на 10 минут — мягко разгружает спину и шею, делается дома без инвентаря:

      👉 {link}

      Если знаешь, что беспокоит больше — спина, шея и плечи или состояние после родов — напиши словом, пришлю практику точнее под тебя.
    question: |-
      Пара слов о себе: что беспокоит и чего хочешь от практики? Так я подскажу по делу, а не общими фразами. Отвечаю сам, не бот.

  spina:
    label: "Спина"
    link: "https://www.youtube.com/watch?v=GAAB323gC3M"
    text: |-
      Привет, Артём Сан на связи 👋

      Вижу, тема здоровья спины для тебя актуальна. Держи короткую практику — три движения, десять минут, делаю её сам по утрам:

      👉 {link}

      От тебя нужны только коврик и желание. Сделай сейчас или сохрани на утро — как удобнее.
    question: |-
      Скажи честно, раз написал про спину — значит что-то беспокоит. Расскажи в двух словах: где болит, как давно, что уже пробовал?

      Спрашиваю, чтобы подсказать по твоей ситуации, а не общими фразами. Это я сам отвечаю, не бот.

  office:
    label: "Шея и плечи"
    link: "https://www.youtube.com/watch?v=WfPSddHeTmo&t=1141s"
    text: |-
      Привет) Артём, тренер по йоге.

      Если к обеду шея не поворачивается, а плечи будто приклеились к ушам — это не «просто устал». Это тело после восьми часов у монитора. Знакомо, сам так сидел.

      Держи короткую разминку на шею и плечи: пять минут, прямо за рабочим столом, вставать не надо.

      👉 {link}
    question: |-
      Скажи — шея и плечи давно так, или накрывает ближе к концу дня?

      Хочу понять, что именно у тебя зажато, чтобы подсказать по делу, а не общими словами. Отвечаю лично, не бот.

  mama:
    label: "Мама"
    link: "https://www.youtube.com/watch?v=xLC6SaigJsM"
    text: |-
      Привет, на связи Артём Сан 👋

      Если руки всё время заняты малышом, а спина и шея уже гудят — держи короткую практику без сложных поз. Её можно сделать, пока малыш спит.

      👉 {link}

      От тебя только 10 минут, коврик и желание. Сделай, когда появится окно — хоть сегодня, хоть завтра утром.
    question: |-
      Расскажи, как ты сейчас — что даёт о себе знать сильнее всего? Спина, шея, или просто ни на что нет сил?

      Хочу подсказать именно под твою ситуацию. Это я лично, не бот.

  # Soft path — reachable only by ?start=trener, never advertised publicly.
  # No video yet: fill `link` or leave it empty (then {link} is not required).
  trener:
    label: "Тренер"
    link: ""
    text: |-
      Привет) Артём на связи.

      Раз спросил про путь тренера — расскажу без прикрас, как это устроено у меня через Fysom. Это не «быстрые деньги», а профессия, которой учатся.

      [ссылка на разбор / материал]

      Посмотри, и если откликнется — напиши, разберём твою ситуацию.
    question: |-
      Ты сейчас уже преподаёшь или только думаешь начать? От этого зависит, с чего тебе заходить.

# 3–5 questions. `q` doubles as the button label. [ ... ] — fill per client.
faq:
  - q: "Сколько стоит?"
    a: |-
      Смотри, как устроено: онлайн-группа — [$.../мес], индивидуально — [$.../занятие], пробное занятие — [бесплатно / $...]. Хочешь, подскажу, что тебе подойдёт? Напиши — подключусь лично.
  - q: "Где и как проходят занятия?"
    a: |-
      Всё онлайн — из дома, по [Zoom]. Нужен только коврик и место, чтобы вытянуться. Никуда ехать не надо. [Если есть офлайн в Минске — добавить.]
  - q: "Я новичок и совсем не гибкий — мне подойдёт?"
    a: |-
      Это самый частый вопрос) Гибкость не нужна, чтобы начать — она появляется по ходу. Мои ученики на первом занятии часто не достают до колен. Через месяц картина другая.
  - q: "Как оплатить?"
    a: |-
      Перевод на карту (Приорбанк) — пришлю реквизиты в личке. Сразу после оплаты записываю тебя в группу. Всё занимает пару минут.
  - q: "Йога — это про эзотерику?"
    a: |-
      Нет. Я работаю с йогой как с упражнениями для тела — без мантр, медитаций и философии. Просто движения, которые убирают зажимы. Будет что-то эзотерическое — скажешь, уберу.

# Free-text messages containing any of these substrings (case-insensitive) are
# treated as a health question: never answered by the bot, always handed to Artyom.
health_keywords:
  - боль
  - болит
  - болью
  - ноет
  - защемил
  - защемление
  - спазм
  - поясниц
  - грыж
  - протруз
